<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case study</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--tx:#111;--mu:#76767b;--line:#e4e4e8;--card:#f3f3f5;--tg:#f2f2f4;--ac:#2a82dc}
:root:has(#theme:checked){--bg:#0b0b0e;--tx:#f4f4f6;--mu:#9a9aa2;--line:#2a2a30;--card:#16161a;--tg:#2b2b2e}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;line-height:1.5;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
#theme{position:absolute;opacity:0;pointer-events:none}
.toggle{position:fixed;top:14px;right:14px;z-index:10;width:40px;height:40px;border-radius:50%;background:var(--tg);border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;font-size:20px;color:var(--tx)}
.toggle::before{content:"☾"}
:root:has(#theme:checked) .toggle::before{content:"☀\FE0E"}
main{max-width:1180px;margin:0 auto;padding:26px clamp(18px,4vw,48px) 90px}
.back{display:inline-block;font-size:13px;font-weight:600;color:var(--mu);padding:6px 0;transition:.2s}
.back:hover{color:var(--tx);transform:translateX(-3px)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
h1{font-size:clamp(46px,12vw,150px);font-weight:600;letter-spacing:-.05em;line-height:.95;margin:clamp(30px,8vw,90px) 0 26px;word-break:break-word}
.lead{font-size:clamp(17px,2.4vw,24px);max-width:680px;color:var(--mu);letter-spacing:-.01em}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;margin-top:clamp(36px,6vw,70px);padding-top:22px;border-top:1px solid var(--line)}
.meta small{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.meta span,.meta a{font-size:16px;font-weight:500}
.meta a{border-bottom:1px solid var(--tx)}
.visit{display:inline-flex;align-items:center;gap:8px;margin-top:30px;padding:14px 28px;border-radius:99px;background:var(--tx);color:var(--bg);font-weight:600;font-size:15px;transition:.25s}
.visit:hover{background:var(--ac);color:#fff;transform:translateY(-2px)}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,24px);margin-top:clamp(40px,7vw,90px)}
.shots a{display:block;border-radius:clamp(14px,2vw,26px);overflow:hidden;background:var(--card);aspect-ratio:16/10}
.shots a.full{grid-column:1/-1}
.shots img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.shots a:hover img{transform:scale(1.03)}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:clamp(60px,9vw,120px) 0 6px}
.feat{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:70px 1fr 1.3fr;gap:18px;padding:26px 0;border-top:1px solid var(--line);align-items:baseline;transition:padding .3s}
.row:hover{padding-left:12px}
.row i{font:500 13px system-ui;color:var(--mu)}
.row b{font-size:clamp(22px,3.4vw,38px);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.row p{font-size:16px;color:var(--mu)}
.end{margin-top:clamp(60px,9vw,120px);text-align:center}
.next{display:block;margin-top:clamp(60px,9vw,120px);padding-top:30px;border-top:1px solid var(--line)}
.next small{font-size:13px;color:var(--mu)}
.next b{display:block;font-size:clamp(34px,8vw,96px);font-weight:600;letter-spacing:-.04em;line-height:1.05;transition:.3s}
.next:hover b{color:var(--ac);transform:translateX(10px)}
.note{color:var(--mu);padding:60px 0}
@media(max-width:700px){.shots{grid-template-columns:1fr}.row{grid-template-columns:34px 1fr}.row p{grid-column:2}}
@media(prefers-reduced-motion:reduce){.rise{animation:none}}
</style></head><body>
<input type="checkbox" id="theme" aria-label="Dark mode"><label class="toggle" for="theme" title="Switch light / dark mode"></label>
<main><a class="back" href="index.html#explorer">← Back</a><div id="c"><p class="note">Loading…</p></div></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
try{var t=document.getElementById('theme');if(localStorage.getItem('theme')==='dark')t.checked=true;t.onchange=function(){localStorage.setItem('theme',t.checked?'dark':'light')}}catch(e){}
(function(){
  var c=document.getElementById('c'),id=new URLSearchParams(location.search).get('id'),cfg=window.CFG||{};
  function el(t,k,x){var e=document.createElement(t);if(k)e.className=k;if(x)e.textContent=x;return e}
  function msg(x){c.innerHTML='';c.appendChild(el('p','note',x))}
  if(!id)return msg('No project selected.');
  if(!window.supabase||!cfg.url||cfg.url.indexOf('YOUR-')>-1)return msg('Add your Supabase keys in config.js.');
  supabase.createClient(cfg.url,cfg.key).from('sites').select('*').eq('category','web').order('created_at',{ascending:true}).then(function(r){
    var all=r.data||[],i=all.findIndex(function(x){return x.id===id}),s=all[i];
    if(r.error||!s)return msg('Project not found.');
    document.title=s.name+' — Case study';c.innerHTML='';
    var live=/^https?:\/\//i.test(s.link||'')?s.link:null,host=live?live.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''):'';
    function visit(){var b=el('a','visit','Visit website \u2197');b.href=live;b.target='_blank';b.rel='noopener';return b}
    var h=el('h1','rise',s.name);c.appendChild(h);
    if(s.purpose){var l=el('p','lead rise',s.purpose);l.style.animationDelay='.1s';c.appendChild(l)}
    if(live){var v=visit();v.classList.add('rise');v.style.animationDelay='.2s';c.appendChild(v)}
    var m=el('div','meta rise');m.style.animationDelay='.3s';
    [['Role',s.role],['Year',s.year],['Tools',s.tools]].forEach(function(p){if(!p[1])return;var d=el('div');d.appendChild(el('small','',p[0]));d.appendChild(el('span','',p[1]));m.appendChild(d)});
    if(live){var d=el('div');d.appendChild(el('small','','Website'));var a=el('a','',host);a.href=live;a.target='_blank';a.rel='noopener';d.appendChild(a);m.appendChild(d)}
    if(m.children.length)c.appendChild(m);
    var pics=(s.gallery&&s.gallery.length)?s.gallery:(s.image_url?[s.image_url]:[]);
    if(pics.length){var g=el('div','shots');
      pics.forEach(function(u,k){var a=el('a',(k===0||(k===pics.length-1&&k%2===1))?'full':'');a.href=u;a.target='_blank';a.rel='noopener';var im=new Image();im.loading='lazy';im.alt=s.name;im.src=u;im.onerror=function(){a.remove()};a.appendChild(im);g.appendChild(a)});c.appendChild(g)}
    var f=s.features||[];
    if(f.length){c.appendChild(el('h2','','Features'));var fg=el('div','feat');
      f.forEach(function(x,n){var d=el('div','row');d.appendChild(el('i','',(n+1<10?'0':'')+(n+1)));d.appendChild(el('b','',x.t));d.appendChild(el('p','',x.d||''));fg.appendChild(d)});c.appendChild(fg)}
    if(live){var e=el('div','end');e.appendChild(visit());c.appendChild(e)}
    if(all.length>1){var nx=all[(i+1)%all.length],n=el('a','next');n.href='case.html?id='+encodeURIComponent(nx.id);n.appendChild(el('small','','Next project'));n.appendChild(el('b','',nx.name+' \u2192'));c.appendChild(n)}
  });
})();
</script></body></html>
